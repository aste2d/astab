<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>astab</title>

  <link rel="stylesheet" href="fonts/fonts.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="enhancements.css">
</head>
<body>
<div class="container">

  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
      </div>
      <div class="tab-cleanup-text">
        <strong id="tabOutDupeCount"></strong> new tabs open.
      </div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes">Close extras</button>
  </div>


  <div class="dashboard-columns" id="dashboardColumns">

    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle">Right now</h2>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

    <header class="page-header">
      <div class="header-left">
        <div class="header-title-row">
          <h1 id="greeting"></h1>
          <div class="date" id="dateDisplay"></div>
          <div class="desk-tools" id="deskTools"></div>
        </div>
        <form class="header-search" id="headerSearchForm">
          <label class="header-search-label" for="headerSearchInput">Search the web</label>
          <div class="header-search-shell">
            <svg class="header-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.85-5.15a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
            <input
              class="header-search-input"
              id="headerSearchInput"
              type="search"
              name="q"
              placeholder="Search with your default engine..."
              autocomplete="off"
              spellcheck="false"
            >
          </div>
        </form>
        <section class="quick-tabs" id="quickTabsSection">
          <div class="bookmark-folder-toolbar" id="bookmarkToolbar" hidden><nav id="bookmarkBreadcrumbs" aria-label="Bookmark folder"></nav><input id="bookmarkSearch" type="search" aria-label="Search all bookmarks" placeholder="Find a bookmark…" hidden></div>
          <div class="quick-tabs-grid" id="quickTabsList"></div><p id="bookmarkEmpty" class="deferred-empty" hidden></p>
          <div class="bookmark-bottom"><div id="bookmarkRoots"></div><span id="bookmarkCount" hidden></span><button id="bookmarkSearchToggle" class="drawer-icon-btn" type="button" aria-label="Search bookmarks" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button><button id="bookmarkRetry" class="drawer-icon-btn" type="button" aria-label="Refresh bookmarks">↻</button></div><p id="bookmarkStatus" class="setting-detail" role="status"></p>
        </section>
      </div>
    </header>

  </div><div class="drawer-trigger-stack" id="drawerTriggerStack">
    <button class="deferred-trigger" id="deferredTrigger" type="button" style="display:none" aria-expanded="false" aria-controls="drawerColumn" aria-label="Open saved for later">
      <svg class="deferred-trigger-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75v13.22a.53.53 0 0 1-.822.443L12 17.348l-4.428 3.065a.53.53 0 0 1-.822-.442V6.75A2.25 2.25 0 0 1 9 4.5h6a2.25 2.25 0 0 1 2.25 2.25Z" />
      </svg>
    </button>

    <button class="deferred-trigger todo-trigger" id="todoTrigger" type="button" aria-expanded="false" aria-controls="drawerColumn" aria-label="Open todos">
      <svg class="deferred-trigger-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" aria-hidden="true">
        <path d="M288.384 173.488a94.208 94.208 0 0 1 93.392-81.488H646.24a94.208 94.208 0 0 1 93.376 81.488h62.176A94.16 94.16 0 0 1 896 267.568V584a32 32 0 1 1-64 0V267.584c0-16.56-13.472-30.08-30.224-30.08H738.24a94.24 94.24 0 0 1-92.016 73.712H381.76a94.24 94.24 0 0 1-92-73.728h-63.552a30.16 30.16 0 0 0-30.224 30.08V841.92c0 16.56 13.472 30.096 30.224 30.096H516a32 32 0 1 1 0 64H226.224a94.16 94.16 0 0 1-94.224-94.08V267.568c0-52.032 42.24-94.08 94.224-94.08h62.176z m93.392-17.488a30.16 30.16 0 0 0-30.224 30.08v31.04c0 16.56 13.472 30.096 30.24 30.096h264.432a30.16 30.16 0 0 0 30.224-30.08v-31.04c0-16.56-13.472-30.096-30.24-30.096H381.792z" fill="currentColor" />
        <path d="M472 444a32 32 0 0 1 32-32h236a32 32 0 1 1 0 64H504a32 32 0 0 1-32-32zM472 668a32 32 0 0 1 32-32h192a32 32 0 1 1 0 64h-192a32 32 0 0 1-32-32zM268 396a32 32 0 0 1 32-32h96a32 32 0 0 1 32 32v96a32 32 0 0 1-32 32h-96a32 32 0 0 1-32-32v-96z m64 32v32h32v-32h-32zM268 624a32 32 0 0 1 32-32h96a32 32 0 0 1 32 32v96a32 32 0 0 1-32 32h-96a32 32 0 0 1-32-32v-96z m64 32v32h32v-32h-32zM926.624 660.752a32 32 0 0 1 0 45.248L719.216 913.424a64 64 0 0 1-90.512 0l-85.328-85.344a32 32 0 1 1 45.248-45.248l85.328 85.328 207.424-207.408a32 32 0 0 1 45.248 0z" fill="currentColor" />
      </svg>
    </button>
    <button class="deferred-trigger timer-trigger" id="timerTrigger" type="button" aria-expanded="false" aria-controls="timerPopover" aria-label="Open Pomodoro" title="Pomodoro"><svg class="deferred-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path stroke-linecap="round" d="M9 2h6m-3 7v4l3 2m3-10 2 2"/></svg><span id="timerMini" hidden></span></button>
  </div>
  <aside id="timerPopover" class="timer-popover" hidden role="dialog" aria-label="Pomodoro" tabindex="-1">
    <div class="timer-heading"><h2>Pomodoro</h2><button class="drawer-icon-btn" id="timerClose" type="button" aria-label="Close Pomodoro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="timer-modes" role="group" aria-label="Timer mode"><button type="button" data-timer-mode="focus" aria-pressed="true">25m</button><button type="button" data-timer-mode="short" aria-pressed="false">5m</button><button type="button" data-timer-mode="long" aria-pressed="false">15m</button></div>
    <div id="timerClock" role="timer" aria-label="Time remaining">25:00</div><p id="timerStatus" class="timer-status" role="status">Focus</p>
    <div class="timer-actions"><button class="theme-menu-action" type="button" id="timerToggle">Start</button><button class="drawer-icon-btn" type="button" id="timerReset" aria-label="Reset timer">↺</button></div>
  </aside>

  <div class="deferred-overlay" id="deferredOverlay" hidden></div>

  <aside class="deferred-column" id="drawerColumn" style="display:none" aria-hidden="true" role="dialog" aria-modal="false" aria-label="Saved items and todos" tabindex="-1">
    <div class="deferred-shell">
      <section class="drawer-panel is-active" id="savedPanel" role="tabpanel" aria-label="Saved for later" tabindex="-1">
        <div class="section-header deferred-header">
          <div class="drawer-title-switch" role="tablist" aria-label="Drawer views">
            <button class="drawer-title-btn is-active" id="savedPanelTab" type="button" role="tab" aria-selected="true" aria-controls="savedPanel" data-action="switch-drawer-view" data-view="saved">Saved for later</button>
            <button class="drawer-title-btn" id="todoPanelTab" type="button" role="tab" aria-selected="false" aria-controls="todoPanel" data-action="switch-drawer-view" data-view="todos">Todos</button>
          </div>
          <div class="section-line"></div>
          <div class="section-count" id="deferredCount"></div>
          <div class="drawer-header-actions">
            <button class="drawer-icon-btn" id="savedSearchToggle" type="button" data-action="toggle-saved-search" aria-label="Search saved for later" aria-expanded="false" aria-controls="savedSearchWrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.6-5.4a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" /></svg>
            </button>
            <button class="drawer-icon-btn" id="deferredCloseBtn" type="button" aria-label="Close right drawer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
          </div>
        </div>

        <div class="saved-search-wrap" id="savedSearchWrap" style="display:none">
          <input type="search" class="archive-search" id="savedSearchInput" placeholder="Search saved pages..." aria-label="Search saved pages">
        </div>

        <div class="deferred-list" id="deferredList"></div>

        <div class="deferred-empty" id="deferredEmpty" style="display:none">
          Nothing saved yet. Park articles and tabs here when they matter, just not right now.
        </div>

        <div class="deferred-archive" id="deferredArchive" style="display:none">
          <div class="archive-header-row">
            <button class="archive-toggle" id="archiveToggle" type="button" aria-expanded="false" aria-controls="archiveBody">
              <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
              Archive
              <span class="archive-count" id="archiveCount"></span>
            </button>
            <button class="archive-clear-btn" id="clearArchiveBtn" type="button" data-action="clear-archive">Clear archive</button>
          </div>
          <div class="archive-body" id="archiveBody" style="display:none" hidden>
            <div class="archive-list" id="archiveList"></div>
          </div>
        </div>
      </section>

      <section class="drawer-panel" id="todoPanel" role="tabpanel" aria-label="Todos" tabindex="-1">
        <div class="section-header deferred-header todo-header">
          <div class="drawer-title-switch" role="tablist" aria-label="Drawer views">
            <button class="drawer-title-btn" type="button" role="tab" aria-selected="false" aria-controls="savedPanel" data-action="switch-drawer-view" data-view="saved">Saved for later</button>
            <button class="drawer-title-btn is-active" type="button" role="tab" aria-selected="true" aria-controls="todoPanel" data-action="switch-drawer-view" data-view="todos">Todos</button>
          </div>
          <div class="section-line"></div>
          <div class="section-count" id="todoCount">0</div>
          <div class="drawer-header-actions todo-header-actions">
            <button class="drawer-icon-btn" id="todoSearchToggle" type="button" data-action="toggle-todo-search" aria-label="Search todos" aria-expanded="false" aria-controls="todoSearchWrap">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.6-5.4a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" /></svg>
            </button>
            <button class="drawer-icon-btn todo-plus-btn" id="todoNewBtn" type="button" data-action="create-todo" aria-label="New todo">+</button>
            <button class="drawer-icon-btn" type="button" data-action="close-drawer" aria-label="Close right drawer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
          </div>
        </div>

        <div class="todo-search-wrap" id="todoSearchWrap" style="display:none">
          <input type="search" class="archive-search" id="todoSearchInput" placeholder="Search todos..." aria-label="Search todos">
        </div>

        <div class="todo-detail-view" id="todoDetailView" style="display:none"></div>
        <div class="todo-list" id="todoList"></div>
        <div class="deferred-empty" id="todoEmpty" style="display:none">No tasks yet. Capture the next step when something needs a follow-up.</div>

        <div class="deferred-archive" id="todoArchive" style="display:none">
          <div class="archive-header-row">
            <button class="archive-toggle" id="todoArchiveToggle" type="button" aria-expanded="false" aria-controls="todoArchiveBody">
              <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
              Archive
              <span class="archive-count" id="todoArchiveCount"></span>
            </button>
            <button class="archive-clear-btn" id="clearTodoArchiveBtn" type="button" data-action="clear-todo-archive">Clear archive</button>
          </div>
          <div class="archive-body" id="todoArchiveBody" style="display:none" hidden>
            <div class="archive-list" id="todoArchiveList"></div>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <footer class="minimal-footer">
    <div id="wallpaperCredit"></div>
    <div class="footer-stats" hidden>
      <div class="stat">
        <div class="stat-num" id="statTabs">—</div>
        <div class="stat-label">Open tabs</div>
      </div>
    </div>
  </footer>

</div><div class="toast" id="toast">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<button class="back-to-top" id="backToTopBtn" type="button" aria-label="Back to top" title="Back to top">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
  </svg>
</button>

<script src="desk-core.js"></script>
<script src="timer-core.js"></script>
<script src="icon-utils.js"></script>
<script src="session-groups.js"></script>
<script src="group-order.js"></script>
<script src="deferred-trigger-position.js"></script>
<script src="todos-store.js"></script>
<script src="list-order.js"></script>
<script src="background-image.js"></script>
<script src="ui-helpers.js"></script>
<script src="palette-core.js"></script>
<script src="theme-controls.js"></script>
<script src="notes-panel.js"></script>
<script src="drawer-manager.js"></script>
<script src="tabs-panel.js"></script>
<script src="card-drag.js"></script>
<script src="close-confirm.js"></script>
<script src="dashboard-runtime.js"></script>

<script src="bookmarks.js"></script>
<script src="forest-library.js"></script>
<script src="wallpaper.js"></script>
<script src="pomodoro.js"></script>
<script src="enhancements.js"></script>
<script src="app.js"></script>
</body>
</html>
